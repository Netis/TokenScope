name: deploy-prod

# Put a published RELEASE on the production host.
#
# Prod tracks releases, not `main`. Cutting a tag is the deliberate act, and
# release.yml already refuses to build a tag whose commit is not both
# `staging-soaked` and `ebpf-soaked` — so by the time a release exists, the
# gate a human used to approve here has already been enforced by machine. This
# workflow is what makes "release" mean "shipped" instead of "downloadable":
#
#   ci(main) → deploy-staging → { staging-soak, ebpf-soak } → tag v* →
#   release.yml (gate + build + publish) → deploy-prod (this) → prod on the release
#
# Security: runs ONLY on the `prod-deploy` self-hosted runner ON the prod host,
# and only on `release: published` / manual dispatch — neither of which a fork
# or PR can raise. The label is not shared with PR CI, so untrusted code never
# reaches the prod host. The deploy installs the published, checksummed artifact
# rather than building on the host.
on:
  release:
    types: [published]
  # Manual lever: redeploy, or pin prod to a specific (e.g. earlier) release.
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag to deploy (default: latest release)"
        required: false

# One prod deploy at a time, and let an in-flight one finish: cancelling
# mid-install would leave the host between binaries. Two releases published
# back to back queue, and the later one lands last, which is the order wanted.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, prod-deploy]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # For `release: published` this checks out the tagged tree, so the deploy
      # script that runs is the one that shipped with the release.
      - uses: actions/checkout@v4

      - name: resolve release tag
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
          else
            tag="${{ github.event.inputs.tag }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "deploying release: ${tag:-<latest>}"

      - name: install the release on prod + gate on health (rollback on failure)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HERON_PROD_BIN: ${{ vars.HERON_PROD_BIN }}
          HERON_PROD_SERVICE: ${{ vars.HERON_PROD_SERVICE }}
          HERON_PROD_PORT: ${{ vars.HERON_PROD_PORT }}
        run: bash scripts/prod/deploy-prod.sh "${{ steps.pick.outputs.tag }}"

      - name: summary
        if: always()
        run: |
          {
            echo "### deploy-prod → \`${{ steps.pick.outputs.tag }}\`"
            echo ""
            echo "- outcome: **${{ job.status }}**"
            echo "- prod installs the published artifact and verifies its SHA256 before restarting."
            echo "- the gate is \`/api/health\` **plus** a read-path smoke over every console endpoint."
          } >> "$GITHUB_STEP_SUMMARY"
